name: build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "构建后发布到 Release（tag 用 v<run_number>）"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: build apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show toolchain
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls -d "$SDK"/build-tools/*/ | sort -V | tail -3
          echo "ANDROID_HOME=$SDK" >>"$GITHUB_ENV"
          java -version

      - name: Cache apktool
        uses: actions/cache@v4
        with:
          path: tools/apktool.jar
          key: apktool-2.11.1

      - name: Build
        run: |
          chmod +x tools/build.sh
          tools/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NissanDA_revive-${{ github.run_number }}
          path: dist/NissanDA_revive.apk
          if-no-files-found: error

      - name: Publish release
        if: inputs.publish || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${GITHUB_RUN_NUMBER}"
          fi
          SHA="$(sha256sum dist/NissanDA_revive.apk | cut -d' ' -f1)"
          NOTES="自动构建产物。

          | 项 | 值 |
          |---|---|
          | 版本 | \`$TAG\` |
          | 提交 | \`$GITHUB_SHA\` |
          | SHA-256 | \`$SHA\` |
          | 签名 | v1 + v2 + v3（\`nissan16\`，与历史版本一致，可覆盖安装） |

          安装前请先卸载官方原版（签名不同）。详见 README 与 DISCLAIMER。"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/NissanDA_revive.apk --clobber
          else
            gh release create "$TAG" dist/NissanDA_revive.apk \
              --title "$TAG" --notes "$NOTES"
          fi
